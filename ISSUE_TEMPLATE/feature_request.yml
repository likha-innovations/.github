name: Feature or improvement
description: Propose a feature, improvement, or documentation change.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Who is affected and what do they need?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable results needed to complete this work.
      placeholder: "- [ ] ...\n- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant links, dependencies, or sketches.
